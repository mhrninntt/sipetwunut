<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPET WUNUT - Sistem Informasi Spasial Desa</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <style>
        :root {
            --tirta-blue: #0284c7; --tirta-light: #e0f2fe; --agri-green: #10b981; 
            --kamulyan-gold: #f59e0b; --bg-body: #f8fafc; --text-dark: #0f172a;
            --white: #ffffff; --glass-bg: rgba(255, 255, 255, 0.85); --transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        * { box-sizing: border-box; } html { scroll-behavior: smooth; }
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-dark); overflow-x: hidden; }
        
        .fade-in { animation: fadeIn 1s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Login & UI Header */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: linear-gradient(135deg, var(--tirta-light) 0%, var(--tirta-blue) 100%); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 350px; text-align: center; }
        .login-input { width: 100%; padding: 12px 15px; margin-bottom: 15px; border: 2px solid #e2e8f0; border-radius: 10px; }
        .login-btn { width: 100%; padding: 12px; background: var(--tirta-blue); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
        
        header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 15px 60px; display: flex; justify-content: space-between; align-items: center; position: fixed; width: 100%; top: 0; z-index: 2000; box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
        .logo-box { display: flex; align-items: center; }
        .logo-box h1 { font-family: 'Montserrat', sans-serif; font-size: 22px; color: var(--tirta-blue); margin-left: 10px; }
        
        /* Dashboard Layout */
        .content-section { display: none; padding-top: 80px; }
        .active-section { display: block; }
        .hero { position: relative; height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; border-bottom: 5px solid var(--kamulyan-gold); overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; background: url('header.jpg') center/cover; filter: blur(6px) brightness(0.65); z-index: 0; }
        .hero-card { position: relative; z-index: 1; background: rgba(255,255,255,0.85); padding: 50px 70px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); backdrop-filter: blur(8px); }
        .hero h2 { font-family: 'Montserrat', sans-serif; font-size: 3.5rem; color: var(--tirta-blue); }
        
        .dashboard-container { max-width: 1200px; margin: 20px auto; padding: 0 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .stat-item { background: var(--white); padding: 35px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.06); border-bottom: 5px solid var(--agri-green); }
        
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 30px; margin-bottom: 50px; }
        .chart-card { background: var(--white); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .gallery-item { border-radius: 15px; overflow: hidden; height: 280px; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-overlay { position: absolute; bottom: 0; background: rgba(0,0,0,0.7); color: white; width: 100%; padding: 15px; }

        /* Map */
        .map-layout { display: block; position: relative; height: 85vh; width: 96%; max-width: 1500px; margin: 20px auto; border-radius: 25px; overflow: hidden; }
        #map { height: 100%; width: 100%; }
        .sidebar-card { position: absolute; top: 20px; left: 20px; z-index: 1000; width: 300px; background: var(--glass-bg); padding: 20px; border-radius: 20px; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2>SIPET WUNUT</h2>
            <input type="email" id="login-user" class="login-input" placeholder="Alamat Email">
            <input type="password" id="login-pass" class="login-input" placeholder="Password">
            <button class="login-btn" onclick="prosesLoginAuth()">MASUK</button>
            <button class="login-btn btn-secondary" onclick="prosesDaftarAuth()" style="margin-top:10px;">DAFTAR</button>
            <div id="login-msg" class="login-error"></div>
        </div>
    </div>

    <div id="main-content">
        <header>
            <div class="logo-box"><h1>SIPET <span>WUNUT</span></h1></div>
            <nav>
                <a href="#" onclick="switchTab('beranda')" id="btn-beranda" class="active">Beranda</a>
                <a href="#" onclick="switchTab('peta')" id="btn-peta">Peta Spasial</a>
                <a href="#" onclick="logoutAuth()" style="color: #ef4444;">Keluar</a>
            </nav>
        </header>

        <main>
            <div id="beranda" class="content-section active-section">
                <div class="hero"><div class="hero-card"><h2>DESA WUNUT</h2><p>Sistem Informasi Peruntukan Tata Ruang</p></div></div>
                <div class="dashboard-container">
                    <div class="stats-grid">
                        <div class="stat-item"><h3>720</h3><p>Luas Wilayah (Ha)</p></div>
                        <div class="stat-item"><h3>2,290</h3><p>Total Penduduk</p></div>
                        <div class="stat-item"><h3>15</h3><p>Mata Air</p></div>
                    </div>
                    <div class="charts-grid">
                        <div class="chart-card"><div id="chart-dinamika"></div></div>
                        <div class="chart-card"><div id="chart-piramida"></div></div>
                    </div>
                    <div class="gallery-grid">
                        <div class="gallery-item"><img src="umbul pelem.webp"><div class="gallery-overlay"><h4>Umbul Pelem</h4></div></div>
                        <div class="gallery-item"><img src="makanan khas.jpg"><div class="gallery-overlay"><h4>Makanan Khas</h4></div></div>
                        <div class="gallery-item"><img src="perikanan budidaya.png"><div class="gallery-overlay"><h4>Perikanan Budidaya</h4></div></div>
                    </div>
                </div>
            </div>

            <div id="peta" class="content-section">
                <div class="map-layout">
                    <div id="map"></div>
                    <div class="sidebar-card">
                        <div id="legend-list-content"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA9Wu4aZNC5ai-UovFyF4al9Prl04xPrFk",
            authDomain: "sipewunut.firebaseapp.com",
            projectId: "sipewunut",
            storageBucket: "sipewunut.firebasestorage.app",
            messagingSenderId: "404576970474",
            appId: "1:404576970474:web:99ff1412dc6adb581d9993",
            measurementId: "G-9MLXMTP7PN"
        };
        const app = initializeApp(firebaseConfig);
        window.firebaseAuth = getAuth(app);
        window.signIn = signInWithEmailAndPassword;
        window.signUp = createUserWithEmailAndPassword;
        window.logOut = signOut;
    </script>

    <script>
        // Fungsi Auth
        function prosesLoginAuth() {
            const email = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            window.signIn(window.firebaseAuth, email, pass).then(() => {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            }).catch(e => alert(e.message));
        }

        function prosesDaftarAuth() {
            const email = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            window.signUp(window.firebaseAuth, email, pass).then(() => alert("Akun berhasil dibuat!")).catch(e => alert(e.message));
        }

        function logoutAuth() {
            window.logOut(window.firebaseAuth).then(() => location.reload());
        }

        function switchTab(id) {
            document.querySelectorAll('.content-section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if(id === 'peta') setTimeout(() => map.invalidateSize(), 100);
        }

        // Peta & Grafik
        var map = L.map('map').setView([-7.5990, 110.6188], 15);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        new ApexCharts(document.querySelector("#chart-dinamika"), {
            series: [{ name: 'Kelahiran', data: [20, 16, 7, 17, 24, 10] }, { name: 'Kematian', data: [8, 18, 9, 18, 21, 23] }],
            chart: { type: 'area', height: 300 }
        }).render();

        new ApexCharts(document.querySelector("#chart-piramida"), {
            series: [{ name: 'Laki-laki', data: [-97, -74, -99, -78, -65] }, { name: 'Perempuan', data: [81, 86, 86, 91, 77] }],
            chart: { type: 'bar', height: 300, stacked: true },
            plotOptions: { bar: { horizontal: true } }
        }).render();
    </script>
</body>
</html>
